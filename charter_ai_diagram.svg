<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Charter AI agent architecture</title>
<desc>A single ReAct orchestrator at the center connects one-way to a knowledgebase of rules and one-way to the editor output, and two-way to the pipeline manager, the code retriever, and a web access tool.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="40" width="200" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="140" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Knowledge + rules</text>
<text x="140" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Guides &amp; catalog</text>

<rect x="440" y="40" width="200" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Retriever</text>
<text x="540" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Grep, semantic search</text>

<rect x="240" y="192" width="200" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="214" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Orchestrator</text>
<text x="340" y="234" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">ReAct loop (LLM)</text>

<rect x="40" y="344" width="190" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="135" y="364" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Pipeline</text>
<text x="135" y="384" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Create, check, delete</text>

<rect x="245" y="344" width="190" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="364" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Web access</text>
<text x="340" y="384" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Search, fetch pages</text>

<rect x="450" y="344" width="190" height="56" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="545" y="364" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4B1528">Editor</text>
<text x="545" y="384" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#72243E">Blocks &amp; diagrams</text>

<line x1="150" y1="96" x2="268" y2="196" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="530" y1="96" x2="412" y2="196" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="145" y1="344" x2="268" y2="252" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="335" y1="344" x2="338" y2="260" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="412" y1="252" x2="525" y2="344" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<line x1="40" y1="428" x2="72" y2="428" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text x="80" y="432" font-family="sans-serif" font-size="12" fill="#444441">One-way: context in / output out</text>
<line x1="40" y1="452" x2="72" y2="452" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="80" y="456" font-family="sans-serif" font-size="12" fill="#444441">Two-way: live tool call</text>
</svg>
